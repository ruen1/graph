  <body>
    <div class="tl_page_wrap">
      <div class="tl_page">
        <main class="tl_article">
          <header class="tl_article_header" dir="auto">
            <h1>Sample Page</h1>
            <address>
              <a rel="author">Anonymous</a><!--
           --><time datetime="2016-12-15T02:11:33+0000">December 15, 2016</time>
            </address>
          </header>
          <article id="_tl_editor" class="tl_article_content"><h1>Sample Page<br></h1><address>Anonymous<br></address><p>Hello, world&#33;</p></article>
          <div id="_tl_link_tooltip" class="tl_link_tooltip"></div>
          <div id="_tl_tooltip" class="tl_tooltip">
            <div class="buttons">
              <span class="button_hover"></span>
              <span class="button_group"><!--
             --><button id="_bold_button"></button><!--
             --><button id="_italic_button"></button><!--
             --><button id="_link_button"></button><!--
           --></span><!--
           --><span class="button_group"><!--
             --><button id="_header_button"></button><!--
             --><button id="_subheader_button"></button><!--
             --><button id="_quote_button"></button><!--
           --></span>
            </div>
            <div class="prompt">
              <span class="close"></span>
              <div class="prompt_input_wrap"><input type="url" class="prompt_input" /></div>
            </div>
          </div>
          <div id="_tl_blocks" class="tl_blocks">
            <div class="buttons">
              <button id="_image_button"></button><!--
           --><button id="_embed_button"></button>
            </div>
          </div>
          <aside class="tl_article_buttons">
            <div class="account account_top"></div>
            <button id="_edit_button" class="button edit_button">{{edit}}</button><!--
         --><button id="_publish_button" class="button publish_button">{{publish}}</button>
            <div class="account account_bottom"></div>
            <div id="_error_msg" class="error_msg"></div>
          </aside>
        </main>
      </div>
          <div class="tl_page_footer">
      <div id="_report_button" class="tl_footer_button">{{report_content}}</div>
    </div>
    </div>
      <div class="tl_popup tl_popup_hidden" id="_report_popup">
    <main class="tl_popup_body tl_report_popup">
      <form id="_report_form" method="post">
        <section>
          <h2 class="tl_popup_header">{{report_page}}</h2>
          <div class="tl_radio_items">
            <label class="tl_radio_item">
              <input type="radio" class="radio" name="reason" value="violence">
              <span class="tl_radio_item_label">{{violence}}</span>
            </label>
            <label class="tl_radio_item">
              <input type="radio" class="radio" name="reason" value="childabuse">
              <span class="tl_radio_item_label">{{child_abuse}}</span>
            </label>
            <label class="tl_radio_item">
              <input type="radio" class="radio" name="reason" value="copyright">
              <span class="tl_radio_item_label">{{copyright}}</span>
            </label>
            <label class="tl_radio_item">
              <input type="radio" class="radio" name="reason" value="illegal_drugs">
              <span class="tl_radio_item_label">{{illegal_drugs}}</span>
            </label>
            <label class="tl_radio_item">
              <input type="radio" class="radio" name="reason" value="personal_details">
              <span class="tl_radio_item_label">{{personal_details}}</span>
            </label>
            <label class="tl_radio_item">
              <input type="radio" class="radio" name="reason" value="other">
              <span class="tl_radio_item_label">{{other}}</span>
            </label>
          </div>
          <div class="tl_textfield_item tl_comment_field">
            <input type="text" class="tl_textfield" name="comment" value="" placeholder="{{add_comment}}" maxlength="500">
          </div>
          <div class="tl_copyright_field">
            {{dmca_request}}
          </div>
        </section>
        <aside class="tl_popup_buttons">
          <button type="reset" class="button" id="_report_cancel">{{cancel}}</button>
          <button type="submit" class="button submit_button">{{report}}</button>
        </aside>
      </form>
    </main>
  </div>

    <script src="/js/config.js?page_id=45237495d34c04a7bf28d"></script>
    <script src="/js/dom.modern.js"></script>
    <script src="/js/load-image.all.min.js?1"></script>
    <script src="/js/quill.min.js?11"></script>
    <script src="/js/core.min.js?68"></script>
  </body>
</html>
